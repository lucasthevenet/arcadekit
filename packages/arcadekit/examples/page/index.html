<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>arcadekit: a game in a page</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 8px;
        background: #10131a;
        color: #c8d0e0;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      canvas {
        background: #181d29;
        border-radius: 6px;
      }
      p {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="480" height="320"></canvas>
    <p id="hud">starting</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
