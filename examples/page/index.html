<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>arcadekit: a game in a page</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 8px;
        background: #10131a;
        color: #c8d0e0;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      canvas {
        background: #181d29;
        border-radius: 6px;
      }
      #ui {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 28px;
      }
      p {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      nav {
        display: flex;
        gap: 8px;
      }
      button {
        font: inherit;
        color: inherit;
        background: #232a3a;
        border: 1px solid #39435a;
        border-radius: 4px;
        padding: 2px 10px;
        cursor: pointer;
      }
      a {
        color: #78dce8;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="480" height="320"></canvas>
    <div id="ui"></div>
    <p>
      The menu is built twice:
      <a href="?ui=dom">with the DOM</a>, <a href="?ui=react">with React</a>.
    </p>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
