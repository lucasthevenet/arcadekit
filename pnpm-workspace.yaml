packages:
  - packages/*
  - apps/*

overrides:
  # The docs site's VitePress 1 asks for Vite 5, a line that gets no more fixes: its dev server
  # has open advisories. Vite 6 is the oldest line that does, and VitePress 1 runs on it
  # (apps/docs/README.md, "How it reads the repository"). Remove this with VitePress 2.
  "vitepress>vite": ^6.4.4
