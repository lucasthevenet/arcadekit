name: Package checks

# The published shape of the kit packages: publint and
# @arethetypeswrong/cli on each packed package, then the pack-and-install smoke test
# (tarballs installed outside the workspace, type-checked with TypeScript 5.9 and 7,
# a small game built with Vite, one copy of effect and three).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: package-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm lint:packages
      - run: pnpm smoke --no-build
