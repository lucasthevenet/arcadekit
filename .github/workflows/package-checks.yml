name: Package checks

# The published shape of the arcadekit package: it is built and packed, then publint and
# @arethetypeswrong/cli read the tarball, so both see exactly what npm would get.

on:
  pull_request:
  push:
    branches: [main, next]

concurrency:
  group: package-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm lint:packages
