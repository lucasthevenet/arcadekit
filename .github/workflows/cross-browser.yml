name: Cross-browser determinism

# Survivors' long-run determinism scenario in Chromium, Firefox and WebKit (#25, ADR-0011):
# every browser must give the hashes pinned in packages/survivors/src/long-run.ts at every step.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: cross-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browsers must match the Playwright in the lockfile, so the cache is keyed on it.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright's browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-firefox-webkit
      - name: Install the browsers and their system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      # The cache holds the browsers, not the system libraries they need.
      - name: Install the browsers' system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit
      - run: pnpm test:browsers
        env:
          CI: true
