name: Cross-browser determinism

# Survivors' long-run determinism scenario in Chromium, Firefox and WebKit

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: cross-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's image has the three browsers and their system libraries, so the job installs
    # nothing from Ubuntu's mirrors. Its tag must match the playwright version in the lockfile.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # Firefox refuses to run as root under a home it doesn't own.
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the image matches the lockfile's Playwright
        run: |
          locked="$(node -p "require('playwright/package.json').version")"
          test "$locked" = "1.63.0" || { echo "Lockfile has Playwright $locked: update the image tag."; exit 1; }
      - run: pnpm test:browsers
        env:
          CI: true
